[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "risk-aware-trading-agents"
version = "0.1.0"
description = "Risk-aware AI trading agents for US stocks: FOMC/CPI/VIX-aware market regimes, EMA 50/100/200 dip buying, earnings-quality checks, cross-verified news (Finviz + RSS), a 30% cash floor, backtesting, and paper/live trading on Alpaca, Interactive Brokers, Public, Schwab, Tradier, tastytrade, Futu/moomoo, Tiger and Longbridge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Risk-Aware Trading Agents contributors" }]
keywords = [
  "trading", "trading-bot", "trading-agents", "ai-trading", "llm-trading", "algorithmic-trading",
  "stock-trading", "backtesting", "risk-management", "portfolio-management", "fomc", "vix",
  "fear-and-greed", "mean-reversion", "ema", "alpaca", "interactive-brokers", "ibkr", "futu",
  "moomoo", "tiger-brokers", "longbridge", "schwab", "tradier", "tastytrade", "public-com",
  "paper-trading", "quant", "finviz",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.54",
  "requests>=2.31",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]
schwab = ["schwab-py>=1.4"]
tastytrade = ["tastytrade>=10.0"]
futu = ["futu-api>=9.0"]
tiger = ["tigeropen>=3.0"]
longbridge = ["longport>=2.0"]
dashboard = ["streamlit>=1.50", "plotly>=5.20"]
llm = ["anthropic>=2.0"]
brokers = [
  "ib_async>=1.0", "schwab-py>=1.4", "tastytrade>=10.0", "futu-api>=9.0", "tigeropen>=3.0",
  "longport>=2.0",
]
all = [
  "ib_async>=1.0", "schwab-py>=1.4", "tastytrade>=10.0", "futu-api>=9.0", "tigeropen>=3.0",
  "longport>=2.0", "streamlit>=1.50", "plotly>=5.20", "anthropic>=2.0",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
riskaware = "riskaware.cli:main"

[project.urls]
Homepage = "https://github.com/jackson-cmd/risk-aware-trading-agents"
Documentation = "https://github.com/jackson-cmd/risk-aware-trading-agents/tree/main/docs"
Issues = "https://github.com/jackson-cmd/risk-aware-trading-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/riskaware"]

[tool.hatch.build.targets.sdist]
include = ["src/riskaware", "tests", "examples", "docs", "config", "README.md", "README_zh.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
  "network: needs internet access (run with: pytest -m network)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]
