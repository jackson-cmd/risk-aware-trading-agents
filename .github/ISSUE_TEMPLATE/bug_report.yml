name: Bug report / 问题反馈
description: Something does not work as described / 功能和描述不一致
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / 发生了什么？
      description: Command, expected result, actual result. Remove API keys and account numbers. / 运行的命令、预期结果、实际结果。请删掉 API key 和账户号。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Output of `riskaware version` and `python --version`
  - type: dropdown
    id: broker
    attributes:
      label: Broker / 券商
      options: [paper, alpaca, public, tradier, ibkr, schwab, tastytrade, futu, tiger, longbridge, none]
