name: Release

# When CI passes on main and pyproject.toml carries a version that has no tag yet, this drafts a GitHub release whose
# notes are the version's section of CHANGELOG.md, attaches the wheel, the source archive and the Claude Desktop extension
# (.mcpb), pushes the Docker image to ghcr.io, and only then publishes the release, which tags the commit vX.Y.Z. Once the
# repository variable PYPI_PUBLISH is "true", the files also go to PyPI, and server.json then goes to the official MCP
# Registry. A version bump in a merged PR is all it takes; pushes that keep the version do nothing. If a job fails, the release stays a draft: re-run the failed jobs. Run the workflow by hand with the tag of a
# published release (v0.7.1 or later) to build its files again and upload them to PyPI, for example after setting
# PyPI up, and with rebuild_image to push its Docker image again; the release itself is not changed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a published release to publish again, e.g. v0.7.1 (leave empty to release the version in pyproject.toml; only from main)"
        required: false
        default: ""
      rebuild_image:
        description: "With a tag: build and push its Docker image again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      draft: ${{ steps.release.outputs.draft }}
      latest: ${{ steps.release.outputs.latest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - id: release
        name: Draft the release
        run: |
          sha=$(git rev-parse HEAD)
          if [ -n "$INPUT_TAG" ]; then
            if [ "$(gh release view "$INPUT_TAG" --json isDraft --jq .isDraft)" != false ]; then
              echo "$INPUT_TAG is not a published release"; exit 1
            fi
            newest=$(gh release view --json tagName --jq .tagName)
            echo "building $INPUT_TAG again" | tee -a "$GITHUB_STEP_SUMMARY"
            { echo "tag=$INPUT_TAG"; echo "sha=$sha"; echo "draft=false"
              echo "latest=$([ "$newest" = "$INPUT_TAG" ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run it from main, or give the tag of a published release."; exit 1
          fi
          version=$(python3 scripts/release_notes.py --version)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to release"
            exit 0
          fi
          python3 scripts/release_notes.py "$version" > notes.md
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release edit "$tag" --target "$sha" --title "$tag" --notes-file notes.md   # a draft left by a failed run
          else
            gh release create "$tag" --draft --target "$sha" --title "$tag" --notes-file notes.md
          fi
          { echo "## Draft $tag at $sha"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
          { echo "tag=$tag"; echo "sha=$sha"; echo "draft=true"; echo "latest=true"; } >> "$GITHUB_OUTPUT"

  dist:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: No headline file in the package (the research headlines are licensed)
        run: python scripts/check_dist.py dist
      - name: Build the Claude Desktop extension
        run: python scripts/build_mcpb.py --out dist-mcpb   # kept out of dist/, which goes to PyPI as it is
      - name: Attach them to the draft
        if: needs.release.outputs.draft == 'true'
        run: gh release upload "$TAG" dist/* dist-mcpb/* --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    needs: release
    if: needs.release.outputs.tag != '' && (needs.release.outputs.draft == 'true' || inputs.rebuild_image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [release, dist, docker]
    if: needs.release.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Publish the release, which creates the tag
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  pypi:
    needs: [release, dist, publish]
    if: >-
      !cancelled() && needs.dist.result == 'success' && vars.PYPI_PUBLISH == 'true' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release.outputs.draft == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/risk-aware-trading-agents/
    permissions:
      id-token: write   # trusted publishing: PyPI checks this workflow's identity, no token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # The registry lists the server under io.github.<owner>/<repo> and checks that the PyPI package's README carries
    # "mcp-name: <that name>" and that the image carries the io.modelcontextprotocol.server.name label, so it runs
    # after both are out. A version can be published once; a re-run with a tag skips what the registry already has.
    needs: [release, docker, pypi]
    if: ${{ !cancelled() && needs.pypi.result == 'success' && needs.docker.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # GitHub OIDC: the registry checks this workflow's identity, no token is stored
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Skip a version the registry already has
        id: check
        run: |
          name=$(jq -r .name server.json); version=$(jq -r .version server.json)
          [ "v$version" = "$TAG" ] || { echo "server.json says $version but the release is $TAG"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name/\//%2F}/versions/$version")
          if [ "$code" = 200 ]; then
            echo "$name $version is already in the MCP Registry" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List the Claude Desktop extension too, with its hash
        if: steps.check.outputs.skip != 'true'
        run: |
          file="risk-aware-trading-agents-${TAG#v}.mcpb"
          if ! gh release download "$TAG" --pattern "$file" --dir "$RUNNER_TEMP"; then
            echo "$file is not on the release; listing the PyPI package and the image only"; exit 0
          fi
          sha=$(sha256sum "$RUNNER_TEMP/$file" | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
          jq --arg url "$url" --arg sha "$sha" \
            '.packages += [{"registryType": "mcpb", "identifier": $url, "fileSha256": $sha, "transport": {"type": "stdio"}}]' \
            server.json > "$RUNNER_TEMP/server.json" && mv "$RUNNER_TEMP/server.json" server.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.check.outputs.skip != 'true'
      - name: Download mcp-publisher and verify its signature
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        if: steps.check.outputs.skip != 'true'
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; PyPI or ghcr.io may not show the new version yet"; sleep 60
          done
          exit 1
