name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running deploy instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploying in a job of its own, as GitHub's own Pages workflow does. Right after an upload, the
  # API that deploy-pages asks can still answer "Found 0 artifact(s)" (ZEUS 0.8.0 hit this when both
  # ran in one job); the hand-over between jobs gives it time, and one retry covers the rest. A
  # failed deploy can then be re-run on its own ("Re-run failed jobs") with the artifact already
  # uploaded, where re-running the whole run uploads a second one and deploy-pages refuses
  # "multiple artifacts".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before trying once more
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: site/sitemap.xml
          sparse-checkout-cone-mode: false
      - name: Tell Bing and the other IndexNow search engines which pages changed
        # IndexNow needs no account: the engines check that the key file below is on the site. Best effort, so a
        # refused ping never fails the deploy.
        continue-on-error: true
        env:
          INDEXNOW_KEY: 0e944e315104b1019f012dabedf088c0
          SITE_URL: https://jackson-cmd.github.io/risk-aware-trading-agents/
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          site, key = os.environ["SITE_URL"], os.environ["INDEXNOW_KEY"]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("site/sitemap.xml", encoding="utf-8").read())
          body = {"host": site.split("/")[2], "key": key, "keyLocation": f"{site}{key}.txt", "urlList": urls}
          request = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow answered {response.status} for {len(urls)} pages")
          PY
