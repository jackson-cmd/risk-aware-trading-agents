name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell Bing and the other IndexNow search engines which pages changed
        # IndexNow needs no account: the engines check that the key file below is on the site. Best effort, so a
        # refused ping never fails the deploy.
        continue-on-error: true
        env:
          INDEXNOW_KEY: 0e944e315104b1019f012dabedf088c0
          SITE_URL: https://jackson-cmd.github.io/risk-aware-trading-agents/
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          site, key = os.environ["SITE_URL"], os.environ["INDEXNOW_KEY"]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("site/sitemap.xml", encoding="utf-8").read())
          body = {"host": site.split("/")[2], "key": key, "keyLocation": f"{site}{key}.txt", "urlList": urls}
          request = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow answered {response.status} for {len(urls)} pages")
          PY
